<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; font: 13px -apple-system, BlinkMacSystemFont, sans-serif; color: #f1f4fa; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 7px 9px; background: transparent; }
  section { max-width: 560px; background: #262a31; border: 1px solid #40454e; border-radius: 9px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 7px 10px; flex-wrap: wrap; }
  .icon { width: 32px; height: 32px; border-radius: 8px; }
  .field { flex: 1; min-width: 104px; }
  h1 { font-size: 13px; line-height: 19px; font-weight: 600; margin: 0; }
  #status { display: flex; align-items: center; gap: 5px; font-size: 11px; line-height: 17px; color: #c2c7d0; }
  #status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #9ba3ae; flex: none; }
  #status[data-state="ready"]::before { background: #62d7a1; }
  #status[data-state="empty"]::before { background: #f4c07c; }
  button { color: #f3f6fa; border: 1px solid #576171; background: #37414e; border-radius: 6px; padding: 5px 12px; font: inherit; cursor: pointer; }
  button:hover:enabled { background: #475669; }
  button:focus-visible { outline: 2px solid #9fc7ff; outline-offset: 2px; }
  button:disabled { opacity: .55; cursor: default; }
  p { margin: 0; border-top: 1px solid #393f49; padding: 7px 12px; color: #bcc3cd; font-size: 11px; line-height: 16px; }
  a { color: #a8cdff; font-size: 12px; }
  [hidden] { display: none !important; }
  .mode { padding: 7px 10px; border-bottom: 1px solid #40454e; }
  .mode label { font-weight: 600; margin-right: auto; }
  details { padding: 7px 10px; }
  summary { cursor: pointer; }
  details input { width: 100%; margin-top: 4px; padding: 5px; font: inherit; }
  select { color: #f3f6fa; background: #37414e; border: 1px solid #576171; border-radius: 5px; padding: 4px 5px; font: inherit; max-width: 100%; }
</style>
<section aria-labelledby="label">
  <div class="row mode"><label for="mode">听写方式</label><select id="mode" disabled>
    <option value="toggle">按一下开始，再按一下结束</option>
    <option value="hold">按住听写，松开结束</option>
  </select></div>
  <div class="row mode"><label for="model">语音转文字</label><select id="model" disabled></select></div>
  <details><summary>润色模型</summary>
    <label for="polishModel">自定义模型 ID（留空使用默认）</label>
    <input id="polishModel" aria-describedby="polishHint" type="text" autocomplete="off" spellcheck="false" disabled>
    <small id="polishHint">填写当前服务商支持 Chat Completions 的文本生成模型 ID。</small>
  </details>
  <p id="guide"></p>
  <div class="row"><a id="helpLink" href="./help.html" target="_blank" rel="noopener">查看配置帮助（含火山引擎图解）</a></div>
  <div class="row">
    <img class="icon" src="assets/openless.png" alt="">
    <div class="field"><h1 id="label">OpenAI API Key</h1><span id="status" role="status">连接 Studio 中…</span></div>
    <a id="keyLink" target="_blank" rel="noopener noreferrer">获取密钥 ↗</a>
    <button type="button" disabled>配置密钥</button>
  </div>
  <div class="row" id="arkRow" hidden>
    <div class="field"><h1>火山方舟 · 文字润色</h1><span id="arkStatus" role="status"></span></div>
    <a id="arkLink" target="_blank" rel="noopener noreferrer">获取方舟密钥 ↗</a>
    <button id="arkButton" type="button" disabled>配置密钥</button>
  </div>
</section>
<script src="models.js"></script>
<script>
  const query = new URLSearchParams(location.search);
  const context = Object.fromEntries(['uuid', 'key', 'actionid'].map(name => [name, query.get(name)]));
  const button = document.querySelector('button');
  const statusLine = document.querySelector('#status');
  const modelSelect = document.querySelector('#model');
  for (const [id, model] of Object.entries(speechModels)) {
    modelSelect.add(new Option(model.service.name + ' · ' + model.asr.split('/').pop(), id));
  }
  let globals;
  let actionSettings = {};
  const polishInput = document.querySelector('#polishModel');
  function showPolishInput() {
    const {service} = speechModel(modelSelect.value);
    polishInput.placeholder = service.polish;
    polishInput.value = customPolishModel(service, actionSettings.polishModels);
  }
  function showModel() {
    const {service, hint} = speechModel(modelSelect.value);
    const separate = Boolean(service.polishKey);
    document.querySelector('#arkRow').hidden = !separate;
    document.querySelector('#keyLink').href = service.keyUrl;
    document.querySelector('#keyLink').textContent = separate ? '获取语音密钥 ↗' : '获取密钥 ↗';
    if (separate) document.querySelector('#arkLink').href = service.polishUrl;
    document.querySelector('#label').textContent = separate ? '豆包语音 · 语音识别' : service.name + ' API Key';
    const polish = customPolishModel(service, actionSettings.polishModels) || service.polish;
    document.querySelector('#guide').textContent = hint + '转写后由 ' + polish + ' 润色。' + (separate ? '' : '两步共用' + service.name + '密钥。');
    if (!globals) return;
    if (separate) {
      const arkSaved = Boolean(globals[service.polishKey]?.data);
      document.querySelector('#arkStatus').textContent = arkSaved ? '已配置' : '尚未配置';
      document.querySelector('#arkButton').textContent = arkSaved ? '更换密钥' : '配置密钥';
    }
    const saved = Boolean(globals[service.key]?.data);
    status(saved ? '已配置' : '尚未配置', saved ? 'ready' : 'empty');
    button.textContent = saved ? '更换密钥' : '配置密钥';
  }
  showPolishInput();
  showModel();
  function status(text, state = '') {
    statusLine.textContent = text;
    statusLine.dataset.state = state;
  }
  if (query.get('address') && query.get('port')) {
    const ws = new WebSocket('ws://' + query.get('address') + ':' + query.get('port'));
    const send = msg => ws.send(JSON.stringify({...context, ...msg}));
    const mode = document.querySelector('#mode');
    polishInput.onchange = () => {
      const {service} = speechModel(modelSelect.value);
      const polishModels = {...actionSettings.polishModels};
      const id = polishInput.value.trim();
      if (id) polishModels[service.id] = id;
      else delete polishModels[service.id];
      actionSettings = {...actionSettings, polishModels};
      send({cmd:'setSettings', settings:actionSettings});
      showPolishInput();
      showModel();
    };
    let timer;
    modelSelect.onchange = () => {
      actionSettings = {...actionSettings, speechModel:modelSelect.value};
      showPolishInput();
      send({cmd:'setSettings', settings:actionSettings});
      showModel();
    };
    mode.onchange = () => {
      actionSettings = {...actionSettings, dictationMode:mode.value};
      send({cmd:'setSettings', settings:actionSettings});
    };
    ws.onopen = () => {
      send({cmd:'connected', code:0});

      status('正在读取配置…');
      timer = setTimeout(() => status('配置状态暂不可用'), 3000);
      send({cmd:'getSettings'});
      send({cmd:'getGlobalSettings'});
    };
    ws.onmessage = event => {
      let msg;
      try { msg = JSON.parse(event.data); } catch { return; }
      if (msg.cmd === 'didReceiveSettings' && msg.actionid === context.actionid && msg.settings) {
        actionSettings = msg.settings;
        mode.value = actionSettings.dictationMode === 'hold' ? 'hold' : 'toggle';
        modelSelect.value = Object.hasOwn(speechModels, actionSettings.speechModel) ? actionSettings.speechModel : 'whisper';
        if (document.activeElement !== polishInput) showPolishInput();
        polishInput.disabled = false;
        modelSelect.disabled = false;
        button.disabled = false;
        document.querySelector('#arkButton').disabled = false;
        showModel();
        mode.disabled = false;
        return;
      }
      if (msg.cmd !== 'didReceiveGlobalSettings' || !msg.settings) return;
      clearTimeout(timer);
      globals = msg.settings;
      showModel();
    };
    ws.onclose = () => {
      clearTimeout(timer);
      button.disabled = true;
      document.querySelector('#arkButton').disabled = true;
      mode.disabled = true;
      polishInput.disabled = true;
      modelSelect.disabled = true;
      status('已断开，请重新选中按键');
    };
    for (const link of document.querySelectorAll('a')) {
      link.onclick = event => {
        if (ws.readyState !== WebSocket.OPEN) return;
        event.preventDefault();
        const local = link.id === 'helpLink';
        send({cmd:'openurl', url:local ? './help.html' : link.href, local});
      };
    }
    document.querySelector('#arkButton').onclick = () => send({cmd:'sendToPlugin', payload:{action:'configure', modelId:modelSelect.value, purpose:'polish'}});
    button.onclick = () => send({cmd:'sendToPlugin', payload:{action:'configure', modelId:modelSelect.value}});
  } else {
    status('请在 Studio 中打开');
  }
</script>
</html>
